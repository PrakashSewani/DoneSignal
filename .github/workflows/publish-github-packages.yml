name: Publish to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git ref to publish (tag, branch or SHA)"
        required: true
        default: "v1.1.1"
  workflow_call:
    inputs:
      tag:
        description: "Git ref to publish"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - run: npm test
      - name: Scope the package for the GitHub Packages namespace
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = "@prakashsewani/donesignal";
            pkg.publishConfig = { registry: "https://npm.pkg.github.com", access: "public" };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log(`publishing ${pkg.name}@${pkg.version}`);
          '
      - name: Publish to npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@prakashsewani/donesignal@${version}" version >/dev/null 2>&1; then
            echo "@prakashsewani/donesignal@${version} is already on GitHub Packages; nothing to do"
          else
            npm publish --access public
          fi
